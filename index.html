<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xGols Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05080f;
  --surface: #0d1523;
  --surface2: #111d2e;
  --border: rgba(255,255,255,0.07);
  --green: #00e676;
  --green-dim: rgba(0,230,118,0.12);
  --yellow: #ffd54f;
  --red: #ff5252;
  --text: #e8eaf6;
  --muted: #546e7a;
  --accent: #00b4d8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events: none; z-index: 0; opacity: 0.5; }

/* TABS */
.nav-tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.nav-tab { flex: 1; padding: 16px; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; user-select: none; }
.nav-tab.active { color: var(--green); border-bottom-color: var(--green); }

/* PAGES */
.page { display: none; }
.page.active { display: block; }

/* HEADER */
header { position: relative; padding: 24px 20px 16px; text-align: center; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(0,230,118,0.04) 0%, transparent 100%); }
.logo-line { display: flex; align-items: center; justify-content: center; }
h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(38px, 9vw, 56px); letter-spacing: 4px; color: #fff; line-height: 1; }
h1 span { color: var(--green); text-shadow: 0 0 28px rgba(0,230,118,0.5); }
.subtitle { margin-top: 6px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }

/* MAIN */
main { max-width: 820px; margin: 0 auto; padding: 16px 12px; position: relative; z-index: 1; }

/* TEAMS */
.teams-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-bottom: 12px; }
.vs-badge { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--muted); letter-spacing: 2px; }
.team-input-wrap { display: flex; flex-direction: column; gap: 5px; }
.team-input-wrap label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.team-input-wrap input[type="text"] { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
.team-input-wrap input[type="text"]:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(0,230,118,0.1); }

/* SECTIONS */
.section { margin-bottom: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; animation: fadeUp 0.4s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.section-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); }
.section-icon { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.si-green { background: rgba(0,230,118,0.15); color: var(--green); }
.si-blue  { background: rgba(0,180,216,0.15); color: var(--accent); }
.si-red   { background: rgba(255,82,82,0.15);  color: var(--red); }
.section-title { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.section-badge { margin-left: auto; font-size: 9px; padding: 2px 7px; border-radius: 20px; background: var(--green-dim); color: var(--green); letter-spacing: 1px; font-weight: 600; }
.tab-toggle { margin-left: auto; display: flex; background: var(--bg); border-radius: 20px; padding: 2px; gap: 2px; }
.ttab { padding: 2px 10px; border-radius: 20px; border: none; background: transparent; color: var(--muted); font-size: 10px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
.ttab.active { background: var(--green); color: #000; }

/* INPUTS */
.inputs-grid { display: grid; grid-template-columns: 1fr 1fr; }
.inputs-column { padding: 10px 10px; }
.inputs-column:first-child { border-right: 1px solid var(--border); }
.col-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }
.num-inputs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }.num-inputs input { width: 100%; height: 36px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 7px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; text-align: center; outline: none; transition: border-color 0.15s; -moz-appearance: textfield; padding: 0; }
.num-inputs input::-webkit-outer-spin-button, .num-inputs input::-webkit-inner-spin-button { -webkit-appearance: none; }
.num-inputs input:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(0,230,118,0.12); }

/* H2H */
.h2h-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 10px; }
.h2h-match { display: flex; flex-direction: column; align-items: center; gap: 2px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 7px; padding: 4px 2px; }
.h2h-match .mlabel { font-size: 7px; letter-spacing: 0; color: var(--muted); text-transform: uppercase; line-height: 1; }
.h2h-match input { width: 100%; height: 26px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 5px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; text-align: center; outline: none; -moz-appearance: textfield; transition: border-color 0.15s; padding: 0; }
.h2h-match input::-webkit-outer-spin-button, .h2h-match input::-webkit-inner-spin-button { -webkit-appearance: none; }
.h2h-match input:focus { border-color: var(--green); }
.h2h-match .sep { font-size: 7px; color: var(--muted); line-height: 1; }

/* BUTTONS */
.btn-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 12px 0; }
.btn-analyze { display: block; width: 100%; padding: 10px 12px; background: var(--green); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 3px; border: none; border-radius: 10px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 3px 14px rgba(0,230,118,0.25); position: relative; overflow: hidden; }
.btn-analyze::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%); transform: translateX(-100%); transition: transform 0.4s; }
.btn-analyze:hover::after { transform: translateX(100%); }
.btn-analyze:hover { transform: translateY(-1px); }
.btn-analyze:active { transform: translateY(0); }
.btn-save { padding: 10px 14px; background: var(--surface2); color: var(--green); font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 2px; border: 1px solid rgba(0,230,118,0.3); border-radius: 10px; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
.btn-save:hover { background: var(--green-dim); }
.btn-save:disabled { opacity: 0.35; cursor: not-allowed; }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--green); color: #000; font-weight: 600; font-size: 13px; padding: 12px 24px; border-radius: 40px; z-index: 999; transition: transform 0.3s cubic-bezier(0.22,1,0.36,1); pointer-events: none; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* RESULTADO */
#resultado { display: none; animation: fadeUp 0.5s ease both; }
.result-header { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px 8px; text-align: center; }
.result-team { flex: 1; }
.result-team-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; color: #fff; }
.result-vs { font-family: 'Bebas Neue', sans-serif; font-size: 12px; color: var(--muted); }
.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; padding: 0 12px 10px; }
.stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 6px; text-align: center; }
.stat-label { font-size: 7px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0; line-height: 1; }
.stat-value.green { color: var(--green); } .stat-value.yellow { color: var(--yellow); } .stat-value.red { color: var(--red); } .stat-value.blue { color: var(--accent); }
.score-section { padding: 0 12px 10px; }
.score-section-title { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.top-placares { display: flex; flex-direction: column; gap: 4px; }
.placar-row { display: flex; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; gap: 6px; }
.placar-row:first-child { border-color: rgba(0,230,118,0.3); background: rgba(0,230,118,0.05); }
.placar-rank { font-size: 9px; color: var(--muted); width: 12px; font-weight: 600; flex-shrink: 0; }
.placar-row:first-child .placar-rank { color: var(--green); }
.placar-score { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; color: #fff; flex-shrink: 0; }
.placar-prob-bar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.placar-prob-fill { height: 100%; background: var(--green); border-radius: 2px; }
.placar-row:nth-child(2) .placar-prob-fill { background: var(--accent); }
.placar-row:nth-child(3) .placar-prob-fill { background: var(--muted); }
.placar-pct { font-size: 11px; font-weight: 600; color: var(--text); min-width: 34px; text-align: right; flex-shrink: 0; }
.win-probs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 0 12px 10px; }
.win-cell { background: var(--surface2); padding: 8px 4px; text-align: center; }
.win-cell-label { font-size: 7px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.win-cell-value { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #fff; }
.win-cell.highlight .win-cell-value { color: var(--green); }
.odd-result-row { display: flex; align-items: center; gap: 10px; margin: 0 12px 10px; background: var(--surface2); border: 1px solid rgba(255,213,79,0.2); border-radius: 10px; padding: 10px 14px; }
.odd-result-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.odd-result-input { width: 80px; height: 32px; background: var(--bg); border: 1px solid rgba(255,213,79,0.35); border-radius: 8px; color: var(--yellow); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; text-align: center; outline: none; -moz-appearance: textfield; padding: 0 6px; transition: border-color 0.15s; }
.odd-result-input::-webkit-outer-spin-button, .odd-result-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.odd-result-input:focus { border-color: var(--yellow); box-shadow: 0 0 0 2px rgba(255,213,79,0.1); }
.odd-result-hint { font-size: 11px; font-weight: 600; margin-left: auto; }
.ev-pos { color: var(--green); }
.ev-neg { color: var(--red); }
.ia-block { margin: 0 12px 12px; border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; }
.ia-block.forte { background: rgba(0,230,118,0.08); border-color: rgba(0,230,118,0.25); }
.ia-block.moderada { background: rgba(255,213,79,0.08); border-color: rgba(255,213,79,0.25); }
.ia-block.evitar { background: rgba(255,82,82,0.08); border-color: rgba(255,82,82,0.25); }
.ia-text h3 { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px; line-height: 1; }
.ia-block.forte h3 { color: var(--green); } .ia-block.moderada h3 { color: var(--yellow); } .ia-block.evitar h3 { color: var(--red); }
.ia-text p { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* HISTÓRICO PAGE */
#page-historico { max-width: 820px; margin: 0 auto; padding: 14px 12px; position: relative; z-index: 1; }
.hist-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.hist-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: #fff; }
.hist-count { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.btn-clear-all { padding: 6px 12px; background: transparent; border: 1px solid rgba(255,82,82,0.3); color: var(--red); border-radius: 7px; font-size: 9px; letter-spacing: 1px; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
.btn-clear-all:hover { background: rgba(255,82,82,0.1); }

/* GLOBAL STATS */
.global-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 12px; }
.global-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 8px 6px; text-align: center; }
.global-stat .glabel { font-size: 7px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.global-stat .gvalue { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: #fff; }
.global-stat .gvalue.green { color: var(--green); }

/* HIST EMPTY */
.hist-empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.hist-empty-icon { font-size: 36px; margin-bottom: 10px; }
.hist-empty-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--muted); margin-bottom: 6px; }
.hist-empty-desc { font-size: 12px; }

/* HIST CARD */
.hist-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; overflow: hidden; animation: fadeUp 0.3s ease both; transition: border-color 0.2s; }
.hist-card:hover { border-color: rgba(255,255,255,0.13); }
.hist-card-header { display: flex; align-items: center; padding: 10px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); gap: 8px; cursor: pointer; }
.hist-card-matchup { flex: 1; min-width: 0; }
.hist-card-teams { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-card-date { font-size: 9px; color: var(--muted); margin-top: 1px; }
.hist-card-badge { padding: 3px 8px; border-radius: 20px; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; }
.hist-card-badge.forte { background: var(--green-dim); color: var(--green); }
.hist-card-badge.moderada { background: rgba(255,213,79,0.12); color: var(--yellow); }
.hist-card-badge.evitar { background: rgba(255,82,82,0.12); color: var(--red); }
.hist-card-toggle { color: var(--muted); font-size: 11px; transition: transform 0.2s; margin-left: 4px; flex-shrink: 0; }
.hist-card.expanded .hist-card-toggle { transform: rotate(180deg); }
.hist-card-body { display: none; padding: 10px 12px; }
.hist-card.expanded .hist-card-body { display: block; }

/* HIST BODY ELEMENTS */
.hist-mini-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; margin-bottom: 8px; }
.hist-mini-stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 6px; text-align: center; }
.hist-mini-stat .hlabel { font-size: 7px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.hist-mini-stat .hvalue { font-family: 'Bebas Neue', sans-serif; font-size: 18px; }
.hist-mini-stat .hvalue.green { color: var(--green); } .hist-mini-stat .hvalue.yellow { color: var(--yellow); } .hist-mini-stat .hvalue.red { color: var(--red); } .hist-mini-stat .hvalue.blue { color: var(--accent); }
.hist-placares { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
.hist-placar-row { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; }
.hist-placar-row:first-child { border-color: rgba(0,230,118,0.25); }
.hist-placar-score { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px; flex: 1; }
.hist-win-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.hist-win-cell { background: var(--surface2); padding: 7px 4px; text-align: center; }
.hist-win-cell .wlabel { font-size: 7px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-win-cell .wvalue { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: #fff; }
.hist-win-cell.best .wvalue { color: var(--green); }

/* RESULTADO REAL */
.hist-result-input { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; margin-bottom: 8px; flex-wrap: wrap; }
.hist-result-input label { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.score-inputs { display: flex; align-items: center; gap: 5px; }
.score-inputs input { width: 36px; height: 30px; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; color: #fff; font-size: 14px; font-weight: 700; text-align: center; outline: none; -moz-appearance: textfield; transition: border-color 0.15s; }
.score-inputs input:focus { border-color: var(--green); }
.score-inputs input::-webkit-outer-spin-button, .score-inputs input::-webkit-inner-spin-button { -webkit-appearance: none; }
.score-sep { font-family: 'Bebas Neue', sans-serif; font-size: 14px; color: var(--muted); }
.btn-save-result { margin-left: auto; padding: 7px 14px; background: var(--green); border: none; border-radius: 7px; color: #000; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: opacity 0.2s; }
.btn-save-result:hover { opacity: 0.85; }
.hist-result-saved { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 8px; flex-wrap: wrap; }
.acerto-badge { padding: 2px 8px; border-radius: 20px; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.acerto-badge.hit { background: var(--green-dim); color: var(--green); }
.acerto-badge.miss { background: rgba(255,82,82,0.12); color: var(--red); }
.hist-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.btn-del-hist { padding: 5px 10px; background: rgba(255,82,82,0.15); border: 1px solid rgba(255,82,82,0.4); border-radius: 5px; color: var(--red); font-size: 9px; letter-spacing: 1px; font-weight: 700; text-transform: uppercase; cursor: pointer; transit
