<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TraderControl</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#f4faf6;--ink:#14261f;--mut:#5a7068;--line:#cfe2d7;--gain:#0a7d5e;--gainbg:#e0f4ec;--loss:#c23b2a;--lossbg:#fbe5e1;--lock:#a86a00;--lockbg:#fbefd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{color:#0a6b50;font-size:20px;font-weight:600;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.status{border-radius:10px;padding:16px;margin-bottom:12px;border:1px solid}
.status.ok{background:var(--gainbg);border-color:var(--gain);color:var(--gain)}
.status.lk{background:var(--lockbg);border-color:var(--lock);color:var(--lock)}
.status b{display:block;font-size:20px}
.status span{font-size:14px;color:var(--ink)}
.pnl{font:600 40px/1.1 "IBM Plex Mono",ui-monospace,monospace;margin:2px 0}
.pos{color:var(--gain)}.neg{color:var(--loss)}
.row{display:flex;gap:10px}
.slots{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px}
.slot{min-width:0;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;min-height:0;font-size:14px;line-height:1.3}
.slot small{color:var(--mut);display:block;font-size:12px}
.slot.g{border:1px solid var(--gain);background:var(--gainbg)}
.slot.l{border:1px solid var(--loss);background:var(--lossbg)}
.slot.next{border-style:solid;border-color:var(--gain)}
.slot strong{font:600 15px "IBM Plex Mono",monospace}
button{font:600 16px "IBM Plex Sans",sans-serif;border:0;border-radius:10px;padding:16px 10px;cursor:pointer;flex:1;color:#fff}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bg{background:#0b8a68}.bl{background:#c23b2a}
button:disabled{opacity:.35;cursor:not-allowed}
.sec{background:transparent;color:var(--mut);border:1px solid var(--line);padding:10px;font-size:14px;font-weight:500}
.bg,.bl{padding:10px;font-size:14px;border:1px solid transparent}
label{display:block;font-size:13px;color:var(--mut)}
input{width:100%;box-sizing:border-box;font:500 15px "IBM Plex Mono",monospace;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
#hist td{white-space:nowrap}
#hist .det td{background:var(--bg);font:400 14px "IBM Plex Sans",system-ui,sans-serif;text-align:left;white-space:normal;padding:2px 12px;border-bottom:0}
.dr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0}
.dr+.dr{border-top:1px solid var(--line)}
td:last-child,th:last-child{text-align:right;font-family:"IBM Plex Mono",monospace}
#hist tr{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
details.card summary{list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .15s;margin-right:4px}
details[open].card summary::after{transform:rotate(-135deg)}
.cfgs{margin-top:10px}
label.prm{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);font-size:15px}
.prm small{display:block;color:var(--mut);font-size:12px}
.prm input{width:112px;flex:none;text-align:right;font-size:16px;padding:9px 10px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:6px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile small{display:block;color:var(--mut);font-size:12px}
.tile b{font:600 17px "IBM Plex Mono",monospace}
.bkv{margin-left:auto;margin-right:10px;font:600 16px "IBM Plex Mono",monospace}
#bk .calc{margin-top:10px}
.bar{position:relative;height:12px;background:var(--line);border-radius:6px;margin:12px 0 30px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--gain);min-width:0}
.bar i.bad{background:var(--loss)}
.bar u{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.bar u::after{content:attr(data-l);position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--mut);white-space:nowrap}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.chip.ok{background:var(--gainbg);color:var(--gain)}.chip.no{background:var(--lossbg);color:var(--loss)}
.top{padding:12px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{flex:none;background:transparent;color:var(--gain);border:2px solid var(--gain);border-radius:999px;padding:6px 14px;font:600 15px "IBM Plex Mono",monospace}
.tabs{display:flex;gap:4px;padding:4px;position:sticky;top:8px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 0 0 8px var(--bg);margin:8px 0 18px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;color:var(--mut);border-radius:16px;padding:6px 4px 5px;font-size:12px;font-weight:500;border:1px solid transparent;transition:background .15s,color .15s}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gain);border-color:var(--gain);background:var(--gainbg);font-weight:600}
.hr{display:flex;align-items:center;gap:8px;min-width:0}
.kebab{flex:none;width:42px;height:42px;padding:0;border-radius:50%;background:transparent;border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center}
.panel{width:100%;max-width:480px;box-sizing:border-box;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.pl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pl .tile{text-align:center;padding:6px 2px;background:var(--card)}
.pl .tile small{font-size:11px}
.pl b{display:block}
.pl .big{font:600 15px "IBM Plex Mono",monospace;color:var(--ink);margin:0}
.pl .val{font:600 12px "IBM Plex Mono",monospace}
.dock{margin:0 0 12px}
.dock .pl{gap:6px}
main{padding-bottom:24px}
.brk{display:block;color:var(--mut);font-size:12px;margin-top:2px}
select{font:500 15px "IBM Plex Sans",system-ui,sans-serif;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:190px}
.addb{display:flex;gap:8px;margin-top:8px}
.addb input{min-width:0;flex:1;text-align:left;font-family:"IBM Plex Sans",system-ui,sans-serif}
#resumo .calc{margin-top:0}
#resumo .tile{padding:12px}
#resumo .tile b{font-size:22px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{border-radius:0;padding:10px;font-size:14px;font-weight:600;background:transparent;color:var(--mut)}
.seg button.on[data-lado="C"]{background:var(--gain);color:#fff}
.seg button.on[data-lado="V"]{background:var(--loss);color:#fff}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:10px 0 10px}
.split i{display:block;height:100%}
.split .c{background:var(--gain)}.split .v{background:var(--loss)}
.brand{position:relative;padding:4px 6px;margin-left:-6px}
.brand .cndl{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.3;pointer-events:none}
.brand h1,.brand .brk{position:relative}
.cndl .g{fill:var(--gain);stroke:var(--gain)}.cndl .r{fill:var(--loss);stroke:var(--loss)}
.cndl line{stroke-width:1.6}.cndl rect.g,.cndl rect.r{stroke:none}
.drow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.drow:last-of-type{margin-bottom:0}
.drow input[type=date]{flex:1;min-width:0;text-align:center;font-size:16px;padding:9px 8px}
.drow .sec{flex:none;padding:9px 12px}
.drow .nav,.cal-h .nav{width:44px;padding:8px 0;font-size:18px}
.tl{flex:1;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.tl input{flex:1;min-width:0;text-align:center;padding:8px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px}
.cal-h .sec{flex:none}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-g .w{text-align:center;color:var(--mut);font-size:12px;font-style:normal}
.cal-g .d{position:relative;flex:none;padding:9px 0;font-size:14px;font-weight:500;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px}
.cal-g .d.gp{background:var(--gainbg);border-color:var(--gain);color:var(--gain)}
.cal-g .d.gl{background:var(--lossbg);border-color:var(--loss);color:var(--loss)}
.cal-g .d.gz{background:var(--line)}
.cal-g .d.td{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-g .d.sl{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal-g .d.lk::after{content:"🔒";position:absolute;top:0;right:1px;font-size:9px}
.cloud{font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:8px}
.cloud.ok{border-color:var(--gain);color:var(--gain)}.cloud.err{border-color:var(--loss);color:var(--loss)}
textarea{width:100%;box-sizing:border-box;font:12px/1.4 "IBM Plex Mono",monospace;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
.calc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.calc3 .tile{padding:8px}.calc3 .tile b{font-size:14px}
.evs{width:100%;height:auto;display:block;margin-top:8px}
.evs text{font:10px "IBM Plex Mono",monospace;fill:var(--mut)}
.kebab{position:relative}
.kebab.due::after{content:"";position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;background:var(--loss);border:2px solid var(--bg)}
.prm input[type=checkbox]{width:24px;height:24px;padding:0;accent-color:var(--gain);flex:none}
.chipx{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 2px 2px 10px;font-size:13px;margin:0 6px 6px 0;background:var(--card)}
.chipx button{flex:none;padding:0 8px;background:transparent;color:var(--mut);font-size:16px;border-radius:999px}
.cal-g .d.nb{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--line) 5px 6px);color:var(--mut)}
.selbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.selbar[hidden]{display:none}
.selall{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink)}
.selall input,#hist input.pk{width:22px;height:22px;padding:0;accent-color:var(--loss);flex:none}
#hist tr.picked td{background:var(--lossbg)}
[hidden]{display:none!important}
.del{flex:none;padding:6px 10px;font-size:13px;background:transparent;color:var(--loss);border:1px solid var(--loss);border-radius:6px}
.hint{font-size:13px;color:var(--mut);margin:8px 0 0}
@media (min-width:900px){
  body{font-size:17px}
  main{max-width:1600px;padding:24px 40px 48px}
  h1{font-size:26px}
  .pill{font-size:17px;padding:8px 18px}
  .dock{max-width:900px}
  .tabs{margin:8px 0 20px;border-radius:999px;padding:5px}
  .tab{flex-direction:row;justify-content:center;gap:10px;font-size:15px;padding:11px 8px;border-radius:999px}
  .tab svg{width:22px;height:22px}
  .pnl{font-size:52px}
  .slots{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  #t-entrada{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
  #t-entrada>*{margin-bottom:0!important}
  #t-entrada>.dbar{grid-column:1 / -1}
  #t-entrada>.res{grid-column:1;grid-row:2 / span 4}
  #t-entrada>#status{grid-column:2}
  #t-entrada>.row,#t-entrada>.seg{grid-column:2}
  #t-metrica{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  #t-metrica>.card{margin-bottom:0}
  #t-metrica>#resumo{grid-column:1 / -1}
  #sheet{align-items:center}
  .panel{border-radius:18px;max-width:560px;max-height:90%}
}
</style>
</head>
<body>
<main>
<header class="top"><div class="brand"><svg class="cndl" viewBox="0 0 240 64" preserveAspectRatio="none" aria-hidden="true"><line class="r" x1="10" y1="34" x2="10" y2="58"/><rect class="r" x="5.5" y="40" width="9" height="12" rx="1"/><line class="g" x1="30" y1="30" x2="30" y2="56"/><rect class="g" x="25.5" y="36" width="9" height="14" rx="1"/><line class="g" x1="50" y1="26" x2="50" y2="50"/><rect class="g" x="45.5" y="30" width="9" height="14" rx="1"/><line class="r" x1="70" y1="26" x2="70" y2="46"/><rect class="r" x="65.5" y="30" width="9" height="10" rx="1"/><line class="g" x1="90" y1="20" x2="90" y2="44"/><rect class="g" x="85.5" y="24" width="9" height="14" rx="1"/><line class="g" x1="110" y1="14" x2="110" y2="38"/><rect class="g" x="105.5" y="18" width="9" height="14" rx="1"/><line class="r" x1="130" y1="14" x2="130" y2="34"/><rect class="r" x="125.5" y="18" width="9" height="10" rx="1"/><line class="r" x1="150" y1="18" x2="150" y2="40"/><rect class="r" x="145.5" y="22" width="9" height="12" rx="1"/><line class="g" x1="170" y1="12" x2="170" y2="34"/><rect class="g" x="165.5" y="16" width="9" height="14" rx="1"/><line class="g" x1="190" y1="6" x2="190" y2="28"/><rect class="g" x="185.5" y="10" width="9" height="14" rx="1"/><line class="g" x1="210" y1="4" x2="210" y2="24"/><rect class="g" x="205.5" y="8" width="9" height="12" rx="1"/><line class="r" x1="230" y1="6" x2="230" y2="26"/><rect class="r" x="225.5" y="10" width="9" height="10" rx="1"/></svg><h1>TraderControl</h1><small class="brk" id="brk"></small></div><div class="hr"><button class="pill" id="pill" data-go="metrica" aria-label="Ver banca"></button><button class="kebab" id="kebab" aria-label="Configurar parâmetros do plano"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></div></header>
<div class="dock"><div class="pl" id="plano"></div></div>
<nav class="tabs" role="tablist">
  <button class="tab on" data-tab="entrada" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Entrada</button>
  <button class="tab" data-tab="historico" role="tab"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h6"/></svg>Histórico</button>
  <button class="tab" data-tab="metrica" role="tab"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg>Control</button>
</nav>
<section id="t-entrada">
<div class="card dbar">
  <div class="drow"><button class="sec nav" id="dprev" aria-label="Dia anterior">‹</button><input type="date" id="dsel" aria-label="Data do lançamento"><button class="sec nav" id="dnext" aria-label="Próximo dia">›</button></div>
  <div class="drow"><label class="tl">Horário<input type="time" id="tin"></label><button class="sec" id="dtoday">Hoje</button><button class="sec" id="dcal">Calendário</button></div>
  <div id="cal" hidden></div>
</div>
<div class="card res">
  <div class="sub" id="rlbl" style="margin:0">Resultado do dia</div>
  <div class="pnl" id="pnl"></div>
  <div class="slots" id="slots"></div>
</div>
<div class="seg" id="seg"><button data-lado="C">Compra</button><button data-lado="V">Venda</button></div>
<div class="row" style="margin-bottom:10px">
  <button class="bg" id="bg">GAIN</button>
  <button class="bl" id="bl">LOSS</button>
</div>
<div class="row" style="margin-bottom:12px">
  <button class="sec" id="undo">Desfazer último</button>
  <button class="sec" id="reset">Zerar o dia</button>
</div>
<div id="status"></div>
</section>
<section id="t-historico" hidden>
<div class="card">
  <strong>Exportar</strong>
  <div class="drow" style="margin:10px 0 8px"><select id="expr" aria-label="Período" style="flex:1;max-width:none"><option value="all">Todo o período</option><option value="month">Este mês</option><option value="week">Últimos 7 dias</option></select></div>
  <div class="drow" style="margin:0"><button class="sec" id="expcsv" style="flex:1">Baixar CSV</button><button class="sec" id="exppdf" style="flex:1">Baixar PDF</button><button class="sec" id="expshr" style="flex:1" hidden>Compartilhar</button></div>
  <div class="hint" id="expmsg"></div>
</div>
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><strong>Últimos dias</strong><button class="sec" id="selbtn" style="flex:none;padding:8px 14px">Selecionar</button></div>
  <div class="selbar" id="selbar" hidden>
    <label class="selall"><input type="checkbox" id="selall"><span id="selcount">Selecionar todos</span></label>
    <button class="bl" id="seldel" style="flex:none;padding:8px 14px" disabled>Apagar</button>
  </div>
  <table id="hist"><tbody></tbody></table>
</div>
</section>
<section id="t-metrica" hidden>
<div class="card" id="resumo"></div>
<div class="card" id="evo"></div>
<div class="card" id="chance"></div>
<div class="card" id="tx"></div>
<div class="card" id="lados"></div>
<div class="card" id="bk">
  <div style="display:flex;justify-content:space-between;align-items:center"><strong>Banca</strong><span class="bkv" id="bkv" style="margin:0"></span></div>
  <div class="cfgs">
    <label class="prm"><span>Banca inicial<small>R$</small></span><input id="bkin" type="number" inputmode="decimal" min="0" step="any" placeholder="0,00"></label>
  </div>
  <div class="calc" id="bkcalc"></div>
</div>
</section>
</main>
<div id="sheet" hidden style="position:fixed;inset:0;background:rgba(10,25,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:8">
  <div class="panel" role="dialog" aria-label="Parâmetros do plano">
    <div style="display:flex;justify-content:space-between;align-items:center"><strong style="font-size:18px">Parâmetros do plano</strong><button class="sec" data-close style="flex:none;padding:8px 14px">Fechar</button></div>
    <div class="lbl" style="margin-top:12px">Corretora</div>
    <label class="prm"><span>Ativa<small>usada nas novas entradas</small></span><select id="corrSel"></select></label>
    <div class="addb"><input id="corrNew" type="text" maxlength="40" placeholder="Nova corretora"><button class="sec" id="corrAdd" style="flex:none;padding:9px 14px">Adicionar</button></div>
    <button class="sec" id="corrDel" style="width:100%;margin:8px 0 14px;color:var(--loss)">Remover selecionada</button>
    <div class="lbl">Parâmetros</div>
    <div class="cfgs" id="cfg"></div>
    <div class="calc" id="calc"></div>
    <div class="lbl" style="margin-top:18px">Dias sem operar</div>
    <label class="prm"><span>Fins de semana<small>sábado e domingo</small></span><input type="checkbox" id="nowk"></label>
    <label class="prm"><span>Feriados da B3<small>calendário padrão da bolsa</small></span><input type="checkbox" id="nohol"></label>

    <div class="row" style="margin-bottom:6px"><button class="sec" id="bkfile">Salvar arquivo</button><button class="sec" id="bkshare" hidden>Compartilhar</button><button class="sec" id="bkload">Restaurar arquivo</button></div>
    <input type="file" id="bkpick" accept=".json,.txt,application/json,text/plain" hidden>

</div>
<div id="dlg" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9">
<div class="card" style="max-width:340px;margin:0"><p id="dmsg" style="margin:0 0 14px"></p><div class="row"><button class="sec" id="dno">Cancelar</button><button class="bl" id="dyes">Apagar</button></div></div></div>
<script>
var KEY="controlador-win-v1";
var DEF={contratos:2,gain:375,loss:250,tentativas:2,perdaMax:200,ponto:0.2,meta:0,ativo:"WIN"};
var S={cfg:Object.assign({},DEF),days:{},banca:0,lado:"C",corr:["XP Investimentos"],corrAtiva:"XP Investimentos",ua:0,lastBackup:0,noOp:{wk:true,hol:true,extra:[],free:[]}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);S.cfg=Object.assign({},DEF,p.cfg);S.days=p.days||{};S.banca=+p.banca||0;S.ua=+p.ua||0;S.lastBackup=+p.lastBackup||0;S.noOp=normNo(p.noOp);if(p.lado==="V")S.lado="V";if(Array.isArray(p.corr)&&p.corr.length)S.corr=p.corr.filter(function(x){return typeof x==="string"&&x});if(typeof p.corrAtiva==="string")S.corrAtiva=p.corrAtiva}}catch(e){}
var cloudRef=null,CLOUD=false,pushT=null,cloudAt="";
function save(){S.ua=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushCloud()}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var cur=today(),sel=cur,calY=+cur.slice(0,4),calM=+cur.slice(5,7)-1;
function brl(v){return (v<0?"-":"")+"R$ "+Math.abs(v).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function val(pts){return pts*S.cfg.ponto*S.cfg.contratos}
function ents(){return S.days[sel]||[]}
function ev(x){return x.v!=null?x.v:(x.r==="gain"?val(S.cfg.gain):-val(S.cfg.loss))}
function sg(x){var v=ev(x);return (v>=0?"+":"")+brl(v)}
function pnl(e){return e.reduce(function(a,x){return a+ev(x)},0)}
(function(){var ch=false,k;for(k in S.days)S.days[k].forEach(function(x){if(x.v==null){x.v=ev(x);ch=true}});if(ch)save()})();
function lockState(){return lockOf(ents(),sel)}
function lockOf(e,k){
  var br=blockReason(k||sel);if(br)return "Dia sem operação ("+br+").";
  var p=pnl(e),T=sel===cur?"até amanhã.":"neste dia.";
  if(S.cfg.meta>0&&p>=S.cfg.meta)return "Meta diária atingida. Ordens bloqueadas "+T;
  if(p<=-S.cfg.perdaMax)return "Perda máxima diária atingida. Ordens bloqueadas "+T;
  if(e.length>=S.cfg.tentativas)return "Limite de "+S.cfg.tentativas+" tentativas atingido. Ordens bloqueadas "+T;
  return null;
}
function add(r){
  if(lockState())return;
  var d=new Date(),ti=document.getElementById("tin"),
  t=(ti&&ti.value)||(sel===cur?String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"):"--:--");
  (S.days[sel]=S.days[sel]||[]).push({r:r,t:t,v:(r==="gain"?val(S.cfg.gain):-val(S.cfg.loss)),b:S.corrAtiva,d:S.lado});
  if(ti)ti.value="";
  save();render();
}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var OPEN={};
function detail(k){
  if(!OPEN[k])return "";
  var c=S.cfg,dt=k.split("-").reverse().join("/");
  var h=S.days[k].map(function(x,i){
    var g=x.r==="gain",cl=g?"pos":"neg";
    return "<div class='dr'>"+
      "<div style='min-width:0'><div>Tentativa "+(i+1)+" · <b class='"+cl+"'>"+(g?"GAIN":"LOSS")+"</b>"+(x.d?" · "+(x.d==="C"?"Compra":"Venda"):"")+"</div>"+
      "<div style='font-size:13px;color:var(--ink);margin-top:2px'>"+(x.b?"<b>"+esc(x.b)+"</b><br>":"")+"<span style='color:var(--mut)'>"+dt+(/^\d\d:\d\d$/.test(x.t)?" às "+esc(x.t):"")+"</span></div></div>"+
      "<b class='"+cl+"' style='font-family:\"IBM Plex Mono\",monospace;white-space:nowrap'>"+sg(x)+"</b></div>";
  }).join("");
  return "<tr class='det'><td colspan='4'>"+h+"</td></tr>";
}
function pb(v,base,sg){if(!(base>0))return "—";var t=Math.abs(v/base*100).toFixed(2).replace(".",",")+"%";return (v<0?"-":(sg&&v>0?"+":""))+t}
function bank(){
  var b=S.banca||0,past=0,fut=0,k,c=S.cfg;
  for(k in S.days){if(k<cur)past+=pnl(S.days[k]);else if(k>cur)fut+=pnl(S.days[k])}
  var open=b+past,day=pnl(S.days[cur]||[]),atual=open+day+fut,acc=past+day+fut;
  var bv=document.getElementById("bkv");
  if(b>0){bv.textContent=brl(atual);bv.className="bkv "+(acc>0?"pos":acc<0?"neg":"")}
  else{bv.textContent="Definir banca";bv.className="bkv"}
  document.getElementById("pill").textContent=bv.textContent;
  document.getElementById("resumo").innerHTML='<div class="calc">'+
    '<div class="tile"><small>Lucro total</small><b class="'+(acc>0?"pos":acc<0?"neg":"")+'">'+brl(acc)+'</b><small>'+(b>0?pb(acc,b,true)+" sobre o investido":"defina a banca inicial")+'</small></div>'+
    '<div class="tile"><small>Total investido</small><b>'+(b>0?brl(b):"—")+'</b><small>banca inicial</small></div></div>';
  function t(l,v,cl,x){return '<div class="tile"><small>'+l+'</small><b class="'+cl+'">'+v+'</b>'+(x?'<small>'+x+'</small>':'')+'</div>'}
  document.getElementById("bkcalc").innerHTML=
    t("Banca atual",b>0?brl(atual):"—",acc>0?"pos":acc<0?"neg":"")+
    t("Acumulado",b>0?brl(acc):"—",acc>0?"pos":acc<0?"neg":"",pb(acc,b,true)+" sobre a inicial")+
    t("Hoje",pb(day,open,true),day>0?"pos":day<0?"neg":"","sobre a banca de abertura")+
    t("Risco por operação",pb(val(c.loss),open,false),"","Perda máx. dia: "+pb(c.perdaMax,open,false));
}
function fp(v){return (Math.round(v*10)/10).toString().replace(".",",")+"%"}
function rate(){
  var w=0,l=0,k,c=S.cfg;
  for(k in S.days)S.days[k].forEach(function(x){x.r==="gain"?w++:l++});
  var n=w+l,lim=c.loss/(c.gain+c.loss)*100,pct=n?w/n*100:0,ok=n&&pct>=lim;
  var chip=n?'<span class="chip '+(ok?"ok":"no")+'">'+(ok?"Acima do limite":"Abaixo do limite")+'</span>':'<span class="chip" style="background:var(--line);color:var(--mut)">Sem entradas</span>';
  document.getElementById("tx").innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center"><strong>Taxa de acerto</strong>'+chip+'</div>'+
    '<div class="pnl '+(n?(ok?"pos":"neg"):"")+'" style="font-size:30px;margin-top:6px">'+(n?fp(pct):"—")+'</div>'+
    '<div class="bar"><i class="'+(n&&!ok?"bad":"")+'" style="width:'+Math.min(pct,100)+'%"></i><u style="left:'+Math.min(lim,100)+'%" data-l="Limite '+fp(lim)+'"></u></div>'+
    '<div class="sub" style="margin:0">'+w+' gain · '+l+' loss · '+n+' entrada'+(n===1?"":"s")+'</div>';
}
function side(){
  var g={C:0,V:0},t={C:0,V:0},k;
  for(k in S.days)S.days[k].forEach(function(x){if(x.d!=="C"&&x.d!=="V")return;t[x.d]++;if(x.r==="gain")g[x.d]++});
  var tg=g.C+g.V,pc=tg?g.C/tg*100:0,pv=tg?100-pc:0;
  function wr(a,b){return b?fp(a/b*100):"—"}
  var h='<strong>Onde estão seus acertos</strong>';
  if(!tg){h+='<p class="sub" style="margin:8px 0 0">Registre entradas escolhendo Compra ou Venda para ver a distribuição.</p>'}
  else{
    h+='<div style="display:flex;justify-content:space-between;font:600 22px \'IBM Plex Mono\',monospace;margin-top:8px"><span class="pos">'+fp(pc)+'</span><span class="neg">'+fp(pv)+'</span></div>'+
    '<div class="split"><i class="c" style="width:'+pc+'%"></i><i class="v" style="width:'+pv+'%"></i></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:13px"><span><b class="pos">Compra</b> · '+g.C+' de '+t.C+' ('+wr(g.C,t.C)+')</span><span style="text-align:right"><b class="neg">Venda</b> · '+g.V+' de '+t.V+' ('+wr(g.V,t.V)+')</span></div>';
  }
  document.getElementById("lados").innerHTML=h;
  var sg=document.getElementById("seg");
  if(sg)Array.prototype.forEach.call(sg.children,function(b){b.classList.toggle("on",b.dataset.lado===S.lado)});
}
function render(){
  if(today()!==cur){var wt=sel===cur;cur=today();if(wt)sel=cur}
  var e=ents(),p=pnl(e),lk=lockState(),c=S.cfg;
  document.getElementById("plano").innerHTML=
    '<div class="tile"><small>Ganho</small><b class="big">'+c.gain+' pts</b><b class="val pos">+'+brl(val(c.gain))+'</b></div>'+
    '<div class="tile"><small>Perda</small><b class="big">'+c.loss+' pts</b><b class="val neg">'+brl(-val(c.loss))+'</b></div>'+
    '<div class="tile"><small>Contratos</small><b class="big">'+c.contratos+'</b><b class="val" style="color:var(--mut)">'+esc(c.ativo||"WIN")+'</b></div>';
  document.getElementById("calc").innerHTML='<div class="tile"><small>Ganho por operação</small><b class="pos">+'+brl(val(c.gain))+'</b></div><div class="tile"><small>Perda por operação</small><b class="neg">'+brl(-val(c.loss))+'</b></div>';
  bank();
  rate();
  side();
  dateUI();
  evo();
  chance();
  backupUI();
  var st=document.getElementById("status");
  if(lk){st.className="status lk";st.innerHTML="<b>Profit travado</b><span>"+lk+"</span>"}
  else{st.className="status ok";var n=e.length+1;
    st.innerHTML="<b>Liberado para operar</b><span>Tentativa "+n+" de "+c.tentativas+". Ainda pode perder "+brl(c.perdaMax+p)+(sel===cur?" hoje.":" neste dia.")+"</span>"}
  if(blockReason(sel))st.innerHTML+='<button class="sec" data-free="1" style="margin-top:10px;width:100%;color:var(--ink)">Operar neste dia mesmo assim</button>';
  noUI();
  var pe=document.getElementById("pnl");pe.textContent=brl(p);pe.className="pnl "+(p>0?"pos":p<0?"neg":"");
  var h="";
  for(var i=0;i<c.tentativas;i++){
    var x=e[i];
    if(x)h+='<div class="slot '+(x.r==="gain"?"g":"l")+'"><small>Tentativa '+(i+1)+(x.t==="--:--"?"":" · "+x.t)+'</small><strong>'+sg(x)+'</strong></div>';
    else h+='<div class="slot'+(!lk&&i===e.length?" next":"")+'"><small>Tentativa '+(i+1)+'</small>'+(lk?"Não usada":i===e.length?"Próxima":"Aguardando")+'</div>';
  }
  document.getElementById("slots").innerHTML=h;
  document.getElementById("bg").disabled=!!lk;
  document.getElementById("bl").disabled=!!lk;
  document.getElementById("undo").disabled=!e.length;
  var days=Object.keys(S.days).filter(function(k){return S.days[k].length}).sort().reverse();
  var tb=days.map(function(k){var v=pnl(S.days[k]);return "<tr data-d='"+k+"' class='"+(selMode&&picked[k]?"picked":"")+"' style='cursor:pointer'><td>"+k.split("-").reverse().join("/")+"</td><td>"+S.days[k].length+(S.days[k].length>1?" entradas":" entrada")+"</td><td class='"+(v>0?"pos":v<0?"neg":"")+"'>"+brl(v)+"</td><td>"+(selMode?"<input type='checkbox' class='pk' aria-label='Selecionar dia'"+(picked[k]?" checked":"")+">":"<button class='del' data-del='"+k+"' aria-label='Apagar dia'>Apagar</button>")+"</td></tr>"+(selMode?"":detail(k))}).join("");
  selUI(days);
  document.querySelector("#hist tbody").innerHTML=tb||"<tr><td>Nenhuma entrada registrada ainda.</td></tr>";
}
function buildCfg(){
  var f=[["ativo","Ativo","ex.: WIN, WDO","txt"],["contratos","Contratos","unidades","int"],["ponto","Valor do ponto","R$ por contrato","dec"],["gain","Ganho","pontos","dec"],["loss","Perda","pontos","dec"],["tentativas","Tentativas","por dia","int"],["perdaMax","Perda máxima diária","R$","dec"],["meta","Meta diária","R$ (0 = sem meta)","dec0"]];
  var g=document.getElementById("cfg");
  g.innerHTML=f.map(function(x){
    var txt=x[3]==="txt";
    return '<label class="prm"><span>'+x[1]+'<small>'+x[2]+'</small></span><input type="'+(txt?'text':'number')+'"'+(txt?' maxlength="10" style="text-transform:uppercase"':' inputmode="decimal" min="0" step="any"')+' data-k="'+x[0]+'" data-t="'+x[3]+'" value="'+esc(S.cfg[x[0]])+'"></label>';
  }).join("");
  g.addEventListener("change",function(ev){
    var el=ev.target,k=el.dataset.k,t=el.dataset.t;if(!k)return;
    var v;
    if(t==="txt"){v=el.value.trim().toUpperCase().slice(0,10);if(!v){el.value=S.cfg[k];return}}
    else{v=parseFloat(String(el.value).replace(",","."));
      if(t==="int"){v=Math.round(v);if(!(v>=1)){el.value=S.cfg[k];return}}
      else if(t==="dec"){if(!(v>0)){el.value=S.cfg[k];return}}
      else{if(!(v>=0)){el.value=S.cfg[k];return}}}
    S.cfg[k]=v;el.value=v;save();render();
  });
}
document.getElementById("bg").onclick=function(){add("gain")};
document.getElementById("bl").onclick=function(){add("loss")};
document.getElementById("undo").onclick=function(){ents().pop();save();render()};
document.getElementById("reset").onclick=function(){if(ents().length){var k=sel;ask("Zerar as entradas do dia "+k.split("-").reverse().join("/")+"? Isso também destrava o Profit neste dia.",function(){delete S.days[k];save();render()})}};
var dlg=document.getElementById("dlg"),dcb=null;
function ask(msg,cb){document.getElementById("dmsg").textContent=msg;dcb=cb;dlg.hidden=false}
document.getElementById("dno").onclick=function(){dlg.hidden=true;dcb=null};
document.getElementById("dyes").onclick=function(){dlg.hidden=true;var f=dcb;dcb=null;if(f)f()};
function delDay(k){ask("Apagar o dia "+k.split("-").reverse().join("/")+" do histórico?",function(){delete S.days[k];save();render()})}
var htb=document.querySelector("#hist tbody");
htb.addEventListener("click",function(ev){if(selMode){var rw=ev.target.closest("tr[data-d]");if(rw){picked[rw.dataset.d]=!picked[rw.dataset.d];render()}return}var b=ev.target.closest("[data-del]");if(b){delDay(b.dataset.del);return}var tr=ev.target.closest("tr[data-d]");if(tr){OPEN[tr.dataset.d]=!OPEN[tr.dataset.d];render()}});
htb.addEventListener("contextmenu",function(ev){ev.preventDefault();var tr=ev.target.closest("tr[data-d]");if(tr)delDay(tr.dataset.d)});
var sheet=document.getElementById("sheet");
document.getElementById("kebab").onclick=function(){sheet.hidden=false};
sheet.addEventListener("click",function(ev){if(ev.target===sheet||ev.target.closest("[data-close]"))sheet.hidden=true});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")sheet.hidden=true});
var TABS=["entrada","historico","metrica"];
function go(t){
  TABS.forEach(function(n){document.getElementById("t-"+n).hidden=n!==t});
  document.querySelectorAll(".tab").forEach(function(b){var on=b.dataset.tab===t;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});
  window.scrollTo(0,0);
}
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-tab],[data-go]");if(b)go(b.dataset.tab||b.dataset.go)});
(function(){
  var x0=0,y0=0,t0=0,ok=false;
  function curTab(){for(var i=0;i<TABS.length;i++)if(!document.getElementById("t-"+TABS[i]).hidden)return i;return 0}
  document.addEventListener("touchstart",function(ev){
    var t=ev.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();
    ok=ev.touches.length===1&&!ev.target.closest("input,select,textarea,#sheet,#dlg");
  },{passive:true});
  document.addEventListener("touchend",function(ev){
    if(!ok)return;ok=false;
    var t=ev.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-t0>700)return;
    var i=curTab()+(dx<0?1:-1);
    if(i>=0&&i<TABS.length)go(TABS[i]);
  },{passive:true});
})();
function renderCorr(){
  if(S.corr.indexOf(S.corrAtiva)<0)S.corrAtiva=S.corr[0];
  var sel=document.getElementById("corrSel");sel.innerHTML="";
  S.corr.forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;if(n===S.corrAtiva)o.selected=true;sel.appendChild(o)});
  document.getElementById("brk").textContent=S.corrAtiva+(CLOUD?" · ☁":"");
  document.getElementById("corrDel").disabled=S.corr.length<2;
}
document.getElementById("corrSel").addEventListener("change",function(ev){S.corrAtiva=ev.target.value;save();renderCorr()});
document.getElementById("corrAdd").onclick=function(){
  var inp=document.getElementById("corrNew"),n=inp.value.trim().slice(0,40);
  if(!n)return;
  var ex=S.corr.filter(function(x){return x.toLowerCase()===n.toLowerCase()})[0];
  if(!ex)S.corr.push(n);
  S.corrAtiva=ex||n;inp.value="";save();renderCorr();
};
document.getElementById("corrDel").onclick=function(){
  if(S.corr.length<2)return;var n=S.corrAtiva;
  ask("Remover a corretora "+n+"? As entradas já registradas continuam no histórico.",function(){
    S.corr=S.corr.filter(function(x){return x!==n});S.corrAtiva=S.corr[0];save();renderCorr();
  });
};
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-lado]");if(b){S.lado=b.dataset.lado;save();side()}});
var MES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function dkey(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function setSel(k){if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;sel=k;calY=+k.slice(0,4);calM=+k.slice(5,7)-1;render()}
function shift(n){var y=+sel.slice(0,4),m=+sel.slice(5,7)-1,d=+sel.slice(8,10),t=new Date(y,m,d+n);setSel(dkey(t.getFullYear(),t.getMonth(),t.getDate()))}
function drawCal(){
  var box=document.getElementById("cal");if(box.hidden)return;
  var first=new Date(calY,calM,1).getDay(),n=new Date(calY,calM+1,0).getDate(),h,i,d,k,arr,v,cl;
  h='<div class="cal-h"><button class="sec nav" data-cm="-1" aria-label="Mês anterior">‹</button><b>'+MES[calM]+' '+calY+'</b><button class="sec nav" data-cm="1" aria-label="Próximo mês">›</button></div><div class="cal-g">';
  "DSTQQSS".split("").forEach(function(w){h+='<i class="w">'+w+'</i>'});
  for(i=0;i<first;i++)h+="<i></i>";
  for(d=1;d<=n;d++){
    k=dkey(calY,calM,d);arr=S.days[k]||[];cl="d";
    if(arr.length){v=pnl(arr);cl+=v>0?" gp":v<0?" gl":" gz";if(lockOf(arr,k))cl+=" lk"}
    if(blockReason(k))cl+=" nb";
    if(k===cur)cl+=" td";if(k===sel)cl+=" sl";
    h+='<button class="'+cl+'" data-day="'+k+'">'+d+'</button>';
  }
  box.innerHTML=h+"</div>";
}
function dateUI(){
  var ds=document.getElementById("dsel");if(ds)ds.value=sel;
  document.getElementById("rlbl").textContent=sel===cur?"Resultado do dia":"Resultado de "+sel.split("-").reverse().join("/")+(sel>cur?" (futuro)":" (passado)");
  drawCal();
}
document.getElementById("dprev").onclick=function(){shift(-1)};
document.getElementById("dnext").onclick=function(){shift(1)};
document.getElementById("dtoday").onclick=function(){setSel(cur)};
document.getElementById("dsel").addEventListener("change",function(ev){setSel(ev.target.value)});
document.getElementById("dcal").onclick=function(){var c=document.getElementById("cal");c.hidden=!c.hidden;drawCal()};
document.addEventListener("click",function(ev){
  var d=ev.target.closest("[data-day]");if(d){setSel(d.dataset.day);return}

  var ph=n?w/n:0,E=n?ph*G-(1-ph)*L:null,pf=ls>0?gs/ls:null;
  function t(a,v,cl,x){return '<div class="tile"><small>'+a+'</small><b class="'+cl+'">'+v+'</b>'+(x?'<small>'+x+'</small>':'')+'</div>'}
  el.innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center"><strong>Chance de sucesso a longo prazo</strong><span class="chip" style="'+cc+'">'+lab+'</span></div>'+
    '<div class="pnl" style="font-size:44px;margin-top:6px">'+(n?idx:"—")+'<span style="font-size:18px;color:var(--mut)"> / 100</span></div>'+
    '<div class="bar"><i style="width:'+(n?idx:0)+'%;background:'+bc+'"></i><u style="left:55%" data-l="55"></u><u style="left:75%" data-l="75"></u></div>'+
    '<div class="calc">'+
      t("Expectativa por entrada",E==null?"—":(E>=0?"+":"")+brl(E),E>0?"pos":E<0?"neg":"")+
      t("Fator de lucro",pf==null?(n&&gs>0?"sem loss":"—"):pf.toFixed(2).replace(".",","),pf!=null&&pf>=1?"pos":pf!=null?"neg":"")+
      t("Sua taxa / mínima",(n?fp(ph*100):"—")+" / "+fp(pb*100),n&&ph>=pb?"pos":n?"neg":"")+
      t("Risco de perder 50% da banca",b>0&&n?fp(simRes.ruin):"—","",b>0?"":"defina a banca")+
    '</div>'+
    '<div class="sub" style="margin:8px 0 0">'+(few?"Registre pelo menos 30 entradas ("+n+" até agora) para uma leitura confiável. ":"")+'Índice = chance de terminar no lucro após 250 entradas, em 2.000 simulações com estimativa conservadora.</div>';
}

/* ===== Backup em arquivo (para trocar de celular sem perder dados) ===== */
function backupDue(){
  if(CLOUD)return false;
  var n=0,k;for(k in S.days)n+=S.days[k].length;
  return n>0&&(Date.now()-(S.lastBackup||0)>7*864e5);
}
function backupUI(){
  var kb=document.getElementById("kebab"),inf=document.getElementById("bkinfo");if(!kb||!inf)return;
  kb.classList.toggle("due",backupDue());
  var t;
  if(CLOUD)t="☁ Seus dados também estão guardados na nuvem. Um arquivo de backup é uma cópia extra.";
  else if(!S.lastBackup)t="Você ainda não salvou um backup. Salve o arquivo e guarde no Google Drive ou WhatsApp para não perder os registros ao trocar de celular.";
  else{var dt=new Date(S.lastBackup),dias=Math.floor((Date.now()-S.lastBackup)/864e5);
    t="Último backup: "+String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0")+"/"+dt.getFullYear()+" às "+String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0")+(dias>=7?" ("+dias+" dias atrás, faça um novo)":"")+"."}
  inf.textContent=t;
}
(function(){
  var msg=document.getElementById("bkmsg"),pick=document.getElementById("bkpick"),shr=document.getElementById("bkshare");
  if(navigator.share&&navigator.canShare)shr.hidden=false;
  function file(share){
    deliver("backup-tradercontrol-"+cur+".json",JSON.stringify(S),"application/json",share).then(function(m){
      msg.textContent=m;
      if(/(Baixando|Arquivo pronto|Compartilhado)/.test(m)){S.lastBackup=Date.now();save();backupUI()}
    });
  }
  document.getElementById("bkfile").onclick=function(){file(false)};
  shr.onclick=function(){file(true)};
  document.getElementById("bkload").onclick=function(){pick.value="";pick.click()};
  pick.addEventListener("change",function(){
    var f=pick.files&&pick.files[0];if(!f)return;
    if(f.size>5e6){msg.textContent="Arquivo grande demais para ser um backup.";return}
    var fr=new FileReader();
    fr.onload=function(){
      var p=null;try{p=JSON.parse(String(fr.result).replace(/^\ufeff/,""))}catch(e){}
      if(!sane(p)){msg.textContent="Arquivo inválido. Escolha um backup gerado pelo TraderControl.";return}
      ask("Restaurar o backup "+f.name+"? Os dados deste aparelho serão substituídos.",function(){
        if(applyRemote(p)){save();msg.textContent="Backup restaurado.";backupUI()}
      });
    };
    fr.onerror=function(){msg.textContent="Não foi possível ler o arquivo."};
    fr.readAsText(f);
  });
  /* o botão de texto também conta como backup */
  var g=document.getElementById("bkgen"),old=g.onclick;
  g.onclick=function(){old&&old.call(g);S.lastBackup=Date.now();save();backupUI()};
})();

/* ===== Dias sem operar: fins de semana, feriados da B3 e dias bloqueados ===== */
function normNo(x){
  x=x&&typeof x==="object"?x:{};
  var ok=function(a){return Array.isArray(a)?a.filter(function(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)}):[]};
  return {wk:x.wk!==false,hol:x.hol!==false,extra:ok(x.extra),free:ok(x.free)};
}
var HOL={};
function holMap(y){
  if(!HOL)HOL={};
  if(HOL[y])return HOL[y];
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1,o={};
  function add(mm,dd,n){o[dkey(y,mm,dd)]=n}
  function off(n,name){var t=new Date(y,mo-1,da+n);o[dkey(t.getFullYear(),t.getMonth(),t.getDate())]=name}
  add(0,1,"Confraternização Universal");add(3,21,"Tiradentes");add(4,1,"Dia do Trabalho");add(8,7,"Independência");
  add(9,12,"Nossa Senhora Aparecida");add(10,2,"Finados");add(10,15,"Proclamação da República");
  if(y>=2024)add(10,20,"Consciência Negra");
  add(11,24,"Véspera de Natal");add(11,25,"Natal");add(11,31,"Véspera de Ano Novo");
  off(-48,"Carnaval");off(-47,"Carnaval");off(-2,"Sexta-feira Santa");off(60,"Corpus Christi");
  return HOL[y]=o;
}
function blockReason(k){
  var n=S.noOp;if(!n||!k||n.free.indexOf(k)>=0)return null;
  if(n.extra.indexOf(k)>=0)return "bloqueado por você";
  var y=+k.slice(0,4),dow=new Date(y,+k.slice(5,7)-1,+k.slice(8,10)).getDay();
  if(n.wk&&(dow===0||dow===6))return dow===0?"domingo":"sábado";
  if(n.hol){var h=holMap(y)[k];if(h)return "feriado: "+h}
  return null;
}
function noUI(){
  var n=S.noOp,w=document.getElementById("nowk"),h=document.getElementById("nohol"),l=document.getElementById("nolist"),t="";
  if(!w||!h||!l)return;
  w.checked=n.wk;h.checked=n.hol;
  function chip(d,tx,kind){return '<span class="chipx">'+dmy(d)+" · "+tx+'<button data-rm="'+kind+"|"+d+'" aria-label="Remover">×</button></span>'}
  n.extra.slice().sort().forEach(function(d){t+=chip(d,"bloqueado","extra")});
  n.free.slice().sort().forEach(function(d){t+=chip(d,"liberado","free")});
  l.innerHTML=t||'<span class="sub" style="margin:0">Nenhum dia extra bloqueado ou liberado.</span>';
}
(function(){
  document.getElementById("nowk").addEventListener("change",function(ev){S.noOp.wk=ev.target.checked;save();render()});
  document.getElementById("nohol").addEventListener("change",function(ev){S.noOp.hol=ev.target.checked;save();render()});
  document.getElementById("noadd").onclick=function(){
    var inp=document.getElementById("nodate"),d=inp.value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;
    S.noOp.free=S.noOp.free.filter(function(x){return x!==d});
    if(S.noOp.extra.indexOf(d)<0)S.noOp.extra.push(d);
    inp.value="";save();render();
  };
  document.addEventListener("click",function(ev){
    var f=ev.target.closest("[data-free]");
    if(f){if(S.noOp.free.indexOf(sel)<0)S.noOp.free.push(sel);S.noOp.extra=S.noOp.extra.filter(function(x){return x!==sel});save();render();return}
    var r=ev.target.closest("[data-rm]");
    if(r){var p=r.dataset.rm.split("|");S.noOp[p[0]]=S.noOp[p[0]].filter(function(x){return x!==p[1]});save();render()}
  });
})();

/* ===== Selecionar e apagar vários dias do histórico ===== */
var selMode=false,picked={};
function allDays(){return Object.keys(S.days).filter(function(k){return S.days[k].length})}
function selUI(days){
  var bar=document.getElementById("selbar"),btn=document.getElementById("selbtn");if(!bar||!btn)return;
  bar.hidden=!selMode;btn.textContent=selMode?"Cancelar":"Selecionar";
  if(!selMode)return;
  var n=days.filter(function(k){return picked[k]}).length,all=days.length>0&&n===days.length;
  document.getElementById("selall").checked=all;
  document.getElementById("selcount").textContent=n?n+" de "+days.length+" dia"+(days.length===1?"":"s")+" selecionado"+(n===1?"":"s"):"Selecionar todos ("+days.length+")";
  var d=document.getElementById("seldel");d.disabled=!n;d.textContent=n?"Apagar ("+n+")":"Apagar";
}
(function(){
  document.getElementById("selbtn").onclick=function(){selMode=!selMode;picked={};render()};
  document.getElementById("selall").addEventListener("change",function(ev){
    picked={};if(ev.target.checked)allDays().forEach(function(k){picked[k]=true});render();
  });
  document.getElementById("seldel").onclick=function(){
    var ks=allDays().filter(function(k){return picked[k]});if(!ks.length)return;
    var tot=allDays().length,ent=0;ks.forEach(function(k){ent+=S.days[k].length});
    var msg=ks.length===tot?"Apagar TODOS os registros ("+ks.length+" dia"+(ks.length===1?"":"s")+", "+ent+" entrada"+(ent===1?"":"s")+")? Esta ação não pode ser desfeita.":"Apagar "+ks.length+" dia"+(ks.length===1?"":"s")+" ("+ent+" entrada"+(ent===1?"":"s")+")? Esta ação não pode ser desfeita.";
    ask(msg,function(){ks.forEach(function(k){delete S.days[k]});selMode=false;picked={};save();render()});
  };
})();
</script>
